Name: AutoDeploy
SchemaVersion: "1.0"

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  Deploy:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        - Run: |
            cd src/worko-sourcetype-jd-resume-matching-dev
            sam build --use-container
            sam deploy --stack-name worko-sourcetype-jd-resume-matching-dev-stack --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-mpwvaft0yfqx --region ap-south-1 --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset
    Environment:
      Name: dev
    Compute:
      Type: EC2
