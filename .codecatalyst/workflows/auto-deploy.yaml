Name: DeployWorkoAILambda
SchemaVersion: "1.0"

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  BuildAndDeploy:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        - Run: |
            echo "=== Detecting changed Lambda functions ==="
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files: $CHANGED"
            
            if echo "$CHANGED" | grep -q "src/worko-sourcetype-jd-resume-matching-dev/"; then
              export TEMPLATE="src/worko-sourcetype-jd-resume-matching-dev/template.yaml"
              export STACK="worko-sourcetype-jd-resume-matching-dev-stack"
              export LAMBDA_DIR="src/worko-sourcetype-jd-resume-matching-dev"
              
            elif echo "$CHANGED" | grep -q "src/worko-bulk-jd-resume-matching/"; then
              export TEMPLATE="src/worko-bulk-jd-resume-matching/template.yaml"
              export STACK="worko-bulk-jd-resume-matching-stack"
              export LAMBDA_DIR="src/worko-bulk-jd-resume-matching"
              
            elif echo "$CHANGED" | grep -q "src/worko-jd-resume-matching/"; then
              export TEMPLATE="src/worko-jd-resume-matching/template.yaml"
              export STACK="worko-jd-resume-matching-stack"
              export LAMBDA_DIR="src/worko-jd-resume-matching"
              
            elif echo "$CHANGED" | grep -q "src/resume-parser/"; then
              export TEMPLATE="src/resume-parser/template.yaml"
              export STACK="resume-parser-stack"
              export LAMBDA_DIR="src/resume-parser"
              
            elif echo "$CHANGED" | grep -q "src/worko-job-description-parser/"; then
              export TEMPLATE="src/worko-job-description-parser/template.yaml"
              export STACK="worko-job-description-parser-stack"
              export LAMBDA_DIR="src/worko-job-description-parser"
              
            elif echo "$CHANGED" | grep -q "src/worko-resume-signup-skills-parser/"; then
              export TEMPLATE="src/worko-resume-signup-skills-parser/template.yaml"
              export STACK="worko-resume-signup-skills-parser-stack"
              export LAMBDA_DIR="src/worko-resume-signup-skills-parser"
              
            else
              echo "No Lambda changed. Skipping deploy."
              exit 0
            fi
            
            echo "Deploying Lambda: $LAMBDA_DIR"
            echo "Template: $TEMPLATE"
            echo "Stack: $STACK"
            
        - Run: |
            if [ -z "$TEMPLATE" ]; then
              echo "No template to deploy"
              exit 0
            fi
            
            echo "=== Building SAM application ==="
            cd $LAMBDA_DIR
            sam build --template template.yaml
            
        - Run: |
            if [ -z "$STACK" ]; then
              echo "No stack to deploy"
              exit 0
            fi
            
            echo "=== Cleaning up failed stack ==="
            aws cloudformation delete-stack --stack-name $STACK --region ap-south-1 || true
            aws cloudformation wait stack-delete-complete --stack-name $STACK --region ap-south-1 || true
            
        - Run: |
            if [ -z "$STACK" ]; then
              echo "No stack to deploy"
              exit 0
            fi
            
            echo "=== Deploying to AWS ==="
            cd $LAMBDA_DIR
            sam deploy \
              --template .aws-sam/build/template.yaml \
              --stack-name $STACK \
              --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-mpwvaft0yfqx \
              --region ap-south-1 \
              --capabilities CAPABILITY_IAM \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset
    Environment:
      Name: dev
    Compute:
      Type: EC2