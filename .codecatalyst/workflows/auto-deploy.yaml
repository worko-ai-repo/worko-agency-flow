Name: DeployAgencyLambda
SchemaVersion: "1.0"

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  BuildAndDeploy:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        - Run: sam build
        - Run: |
            sam deploy \
              --stack-name worko-agency-test \
              --s3-bucket worko-agency-artifacts \
              --s3-prefix agency-test \
              --region ap-south-1 \
              --capabilities CAPABILITY_IAM \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset
    Environment:
      Name: dev
      Connections:
        - Name: default
          Role: CodeCatalystWorkflowDevelopmentRole-worko
    Compute:
      Type: EC2
