Name: DeployWorkoAILambda
SchemaVersion: "1.0"

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  BuildAndDeploy:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        - Run: |
            set -e  # Exit on error
            set -x  # Print commands for debugging
            
            echo "=== Detecting changed Lambda functions ==="
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED"
            
            DEPLOY_LAMBDAS=""
            
            if echo "$CHANGED" | grep -q "src/worko-sourcetype-jd-resume-matching-dev/"; then
              DEPLOY_LAMBDAS="$DEPLOY_LAMBDAS worko-sourcetype-jd-resume-matching-dev"
              echo "Detected changes in worko-sourcetype-jd-resume-matching-dev"
            fi
            
            if echo "$CHANGED" | grep -q "src/worko-secret-manager-dev/"; then
              DEPLOY_LAMBDAS="$DEPLOY_LAMBDAS worko-secret-manager-dev"
              echo "Detected changes in worko-secret-manager-dev"
            fi
            
            if echo "$CHANGED" | grep -q "src/worko-bulk-jd-resume-matching/"; then
              DEPLOY_LAMBDAS="$DEPLOY_LAMBDAS worko-bulk-jd-resume-matching"
              echo "Detected changes in worko-bulk-jd-resume-matching"
            fi
            
            if echo "$CHANGED" | grep -q "src/worko-jd-resume-matching/"; then
              DEPLOY_LAMBDAS="$DEPLOY_LAMBDAS worko-jd-resume-matching"
              echo "Detected changes in worko-jd-resume-matching"
            fi
            
            if echo "$CHANGED" | grep -q "src/resume-parser/"; then
              DEPLOY_LAMBDAS="$DEPLOY_LAMBDAS resume-parser"
              echo "Detected changes in resume-parser"
            fi
            
            if echo "$CHANGED" | grep -q "src/worko-job-description-parser/"; then
              DEPLOY_LAMBDAS="$DEPLOY_LAMBDAS worko-job-description-parser"
              echo "Detected changes in worko-job-description-parser"
            fi
            
            if echo "$CHANGED" | grep -q "src/worko-resume-signup-skills-parser/"; then
              DEPLOY_LAMBDAS="$DEPLOY_LAMBDAS worko-resume-signup-skills-parser"
              echo "Detected changes in worko-resume-signup-skills-parser"
            fi
            
            if [ -z "$DEPLOY_LAMBDAS" ]; then
              echo "No Lambda functions changed. Skipping deployment."
              exit 0
            fi
            
            echo "=== Lambdas to deploy: $DEPLOY_LAMBDAS ==="
            
            # Build each Lambda
            for lambda in $DEPLOY_LAMBDAS; do
              echo ""
              echo "=========================================="
              echo "=== Building $lambda ==="
              echo "=========================================="
              
              if [ ! -d "src/$lambda" ]; then
                echo "ERROR: Directory src/$lambda does not exist. Skipping."
                continue
              fi
              
              cd "src/$lambda"
              echo "Current directory: $(pwd)"
              echo "Files in directory:"
              ls -la
              
              echo "Starting SAM build..."
              sam build --template template.yaml --use-container --debug
              
              echo "Build completed. Contents of .aws-sam/build/:"
              ls -la .aws-sam/build/ || echo "Build directory not found"
              
              cd ../..
            done
            
            # Clean old stacks
            for lambda in $DEPLOY_LAMBDAS; do
              STACK="$lambda-stack"
              echo ""
              echo "=========================================="
              echo "=== Cleaning up old stack: $STACK ==="
              echo "=========================================="
              
              if aws cloudformation describe-stacks --stack-name "$STACK" --region ap-south-1 2>/dev/null; then
                echo "Stack $STACK exists. Deleting..."
                aws cloudformation delete-stack --stack-name "$STACK" --region ap-south-1 || true
                echo "Waiting for stack deletion..."
                aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region ap-south-1 || true
                echo "Stack deleted successfully"
              else
                echo "Stack $STACK does not exist. Skipping cleanup."
              fi
            done
            
            # Deploy each Lambda
            for lambda in $DEPLOY_LAMBDAS; do
              STACK="$lambda-stack"
              echo ""
              echo "=========================================="
              echo "=== Deploying $lambda to AWS ==="
              echo "=========================================="
              
              if [ ! -d "src/$lambda" ]; then
                echo "ERROR: Directory src/$lambda does not exist. Skipping."
                continue
              fi
              
              cd "src/$lambda"
              echo "Current directory: $(pwd)"
              
              if [ ! -f ".aws-sam/build/template.yaml" ]; then
                echo "ERROR: Build template not found at .aws-sam/build/template.yaml"
                echo "Contents of .aws-sam/:"
                ls -la .aws-sam/ || echo ".aws-sam directory not found"
                cd ../..
                continue
              fi
              
              echo "Deploying with SAM..."
              sam deploy \
                --template .aws-sam/build/template.yaml \
                --stack-name "$STACK" \
                --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-mpwvaft0yfqx \
                --region ap-south-1 \
                --capabilities CAPABILITY_IAM \
                --no-confirm-changeset \
                --no-fail-on-empty-changeset \
                --debug
              
              echo "Deployment completed for $lambda"
              cd ../..
            done
            
            echo ""
            echo "=========================================="
            echo "=== All deployments completed ==="
            echo "=========================================="
    Environment:
      Name: dev
    Compute:
      Type: EC2
