Name: DeploySourcetypeJDResumeMatching
SchemaVersion: "1.0"

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  Deploy:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        - Run: |
            set -e
            set -x
            
            echo "=== Checking for changes in worko-sourcetype-jd-resume-matching-dev ==="
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            
            if ! echo "$CHANGED" | grep -q "src/worko-sourcetype-jd-resume-matching-dev/"; then
              echo "No changes detected. Skipping deployment."
              exit 0
            fi
            
            echo "=== Deploying worko-sourcetype-jd-resume-matching-dev ==="
            
            cd src/worko-sourcetype-jd-resume-matching-dev
            
            echo "Building Lambda..."
            sam build --template template.yaml --use-container --debug
            
            echo "Deploying to AWS..."
            sam deploy \
              --template .aws-sam/build/template.yaml \
              --stack-name worko-sourcetype-jd-resume-matching-dev-stack \
              --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-mpwvaft0yfqx \
              --region ap-south-1 \
              --capabilities CAPABILITY_IAM \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --debug
            
            echo "Deployment completed successfully!"
    Environment:
      Name: dev
    Compute:
      Type: EC2
