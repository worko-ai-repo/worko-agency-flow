Name: DeployResumeParserLambda
SchemaVersion: "1.0"

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  BuildAndDeploy:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        - Run: |
            echo "=== Resume Parser Lambda Deployment with Rollback ===" 
            export AWS_REGION=ap-south-1
            export AWS_DEFAULT_REGION=ap-south-1
            STACK_NAME="resume-parser-dev-stack"
            FUNCTION_NAME="resume-parser"
            
            # Backup current Lambda function for rollback
            echo "Backing up current Lambda function..."
            BACKUP_FILE="/tmp/lambda-backup.zip"
            CURRENT_CONFIG="/tmp/lambda-config.json"
            
            if aws lambda get-function --function-name $FUNCTION_NAME --region $AWS_REGION 2>/dev/null; then
              echo "Lambda function exists, creating backup..."
              
              # Download current function code
              DOWNLOAD_URL=$(aws lambda get-function --function-name $FUNCTION_NAME --region $AWS_REGION --query 'Code.Location' --output text)
              curl -o $BACKUP_FILE "$DOWNLOAD_URL"
              
              # Save current configuration
              aws lambda get-function-configuration --function-name $FUNCTION_NAME --region $AWS_REGION > $CURRENT_CONFIG
              
              echo "Backup completed. Deleting existing Lambda function..."
              aws lambda delete-function --function-name $FUNCTION_NAME --region $AWS_REGION
              
              echo "Lambda function deleted successfully"
            else
              echo "No existing Lambda function found"
            fi
            
            cd src/resume-parser
            
            echo "Building SAM application..."
            sam build --use-container
            BUILD_EXIT_CODE=$?
            if [ $BUILD_EXIT_CODE -ne 0 ]; then
              echo "ERROR: Build failed"
              exit 1
            fi
            
            echo "Validating template..."
            aws cloudformation validate-template --template-body file://.aws-sam/build/template.yaml --region $AWS_REGION
            
            echo "Deploying to CloudFormation..."
            sam deploy \
              --template-file .aws-sam/build/template.yaml \
              --stack-name $STACK_NAME \
              --region $AWS_REGION \
              --capabilities CAPABILITY_IAM \
              --parameter-overrides Environment=dev \
              --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-mpwvaft0yfqx \
              --on-failure ROLLBACK \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset
            
            DEPLOY_EXIT_CODE=$?
            
            if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
              echo "ERROR: Deployment failed with exit code $DEPLOY_EXIT_CODE"
              
              # Rollback logic - restore previous Lambda function
              if [ -f "$BACKUP_FILE" ] && [ -f "$CURRENT_CONFIG" ]; then
                echo "Rolling back to previous Lambda function..."
                
                # Extract configuration from backup
                ROLE_ARN=$(cat $CURRENT_CONFIG | jq -r '.Role')
                HANDLER=$(cat $CURRENT_CONFIG | jq -r '.Handler')
                RUNTIME=$(cat $CURRENT_CONFIG | jq -r '.Runtime')
                TIMEOUT=$(cat $CURRENT_CONFIG | jq -r '.Timeout')
                MEMORY=$(cat $CURRENT_CONFIG | jq -r '.MemorySize')
                ENV_VARS=$(cat $CURRENT_CONFIG | jq -r '.Environment.Variables // {}')
                
                # Recreate Lambda function with backup
                aws lambda create-function \
                  --function-name $FUNCTION_NAME \
                  --runtime $RUNTIME \
                  --role $ROLE_ARN \
                  --handler $HANDLER \
                  --zip-file fileb://$BACKUP_FILE \
                  --timeout $TIMEOUT \
                  --memory-size $MEMORY \
                  --environment Variables="$ENV_VARS" \
                  --region $AWS_REGION || true
                
                echo "Rollback completed - previous Lambda function restored"
              else
                echo "No backup found - cannot rollback"
              fi
              
              echo "Fetching CloudFormation Stack Events..."
              aws cloudformation describe-stack-events --stack-name $STACK_NAME --region $AWS_REGION --max-items 20 || true
              exit 1
            fi
            
            echo "SUCCESS: Resume Parser Lambda deployed successfully"
            
            # Verify deployment
            NEW_VERSION=$(aws lambda get-function --function-name $FUNCTION_NAME --region $AWS_REGION --query 'Configuration.Version' --output text)
            echo "New version deployed: $NEW_VERSION"
    Environment:
      Name: dev
    Compute:
      Type: EC2